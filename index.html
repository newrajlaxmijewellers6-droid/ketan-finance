<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1D9E75"/>
<title>Ketan Verma Finance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F0F0F5;color:#111;font-size:15px;}
.top{background:#1D9E75;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999;}
.top h1{font-size:17px;font-weight:700;}.top p{font-size:11px;opacity:.8;}
.topbtns{display:flex;gap:6px;}
.tbtn{background:rgba(255,255,255,.25);border:none;color:#fff;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:999;}
.ni{flex:1;border:none;background:none;padding:8px 0 5px;font-size:10px;font-weight:600;color:#aaa;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
.ni.on{color:#1D9E75;}.ni-ic{font-size:22px;line-height:1;}
.page{display:none;padding:10px;padding-bottom:80px;max-width:500px;margin:0 auto;}.page.on{display:block;}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.sc{background:#fff;border-radius:10px;padding:10px 12px;border:1px solid #e5e5e5;}
.sc.full{grid-column:1/-1;}
.sl{font-size:11px;color:#888;font-weight:600;margin-bottom:3px;}.sv{font-size:18px;font-weight:700;}
.gn{color:#1D9E75;}.rd{color:#D85A30;}.or{color:#BA7517;}.pu{color:#534AB7;}
.alrt{background:#FDF0D5;border:1px solid #BA7517;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13px;color:#633806;font-weight:600;display:none;}
.fc{background:#fff;border-radius:14px;border:1px solid #e5e5e5;overflow:hidden;margin-bottom:12px;}
.fh{padding:12px 14px;color:#fff;font-size:15px;font-weight:700;}
.fb{padding:12px 12px 6px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.r1{margin-bottom:8px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:12px;font-weight:700;color:#555;}
input,select{width:100%;background:#F0F0F5;border:1.5px solid #ddd;border-radius:10px;padding:10px 11px;font-size:15px;font-family:inherit;color:#111;outline:none;min-height:46px;-webkit-appearance:none;}
input:focus,select:focus{border-color:#1D9E75;background:#fff;}
.ibox{background:#F0F0F5;border-radius:10px;padding:10px 11px;margin-bottom:8px;}
.itl{font-size:12px;font-weight:700;color:#555;margin-bottom:8px;}
.trow{display:flex;align-items:center;gap:10px;padding:5px 0;}
.tlbl{font-size:14px;color:#555;flex:1;}
.tgl{position:relative;width:48px;height:28px;flex-shrink:0;}
.tgl input{opacity:0;width:0;height:0;}
.ts{position:absolute;inset:0;background:#ccc;border-radius:14px;cursor:pointer;transition:.2s;}
.ts::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2);}
.tgl input:checked+.ts{background:#1D9E75;}
.tgl input:checked+.ts::before{transform:translateX(20px);}
.btn{display:flex;align-items:center;justify-content:center;padding:12px;border-radius:10px;border:1.5px solid #ddd;background:#fff;color:#111;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;min-height:48px;}
.btn:active{opacity:.7;}
.btn.gn{background:#1D9E75;color:#fff;border-color:#1D9E75;}
.btn.rd{background:#D85A30;color:#fff;border-color:#D85A30;}
.btn.bl{background:#185FA5;color:#fff;border-color:#185FA5;}
.btn.pu{background:#534AB7;color:#fff;border-color:#534AB7;}
.btn.or{background:#BA7517;color:#fff;border-color:#BA7517;}
.btn.sm{padding:6px 10px;font-size:12px;min-height:32px;border-radius:8px;}
.brow{display:flex;gap:8px;margin-top:10px;padding-bottom:8px;}
.sec{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px 2px;}
.bdg{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.b-cr{background:#dcf5ec;color:#0F6E56;}.b-dr{background:#fde8e0;color:#993C1D;}
.b-ir{background:#fdf0d5;color:#633806;}.b-ip{background:#eeedfe;color:#3C3489;}
.b-em{background:#eeedfe;color:#3C3489;}.b-ex{background:#deedfb;color:#0C447C;}
.b-pd{background:#dcf5ec;color:#0F6E56;}.b-ov{background:#fde8e0;color:#993C1D;}.b-pe{background:#fdf0d5;color:#633806;}
.accard{background:#fff;border:1px solid #e5e5e5;border-radius:14px;margin-bottom:10px;overflow:hidden;}
.ac-hdr{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;}
.ac-hdr:active{background:#f5f5f5;}
.acav{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;}
.acname{font-weight:700;font-size:15px;}
.acsub{font-size:12px;color:#888;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.chv{color:#ccc;font-size:18px;margin-left:auto;flex-shrink:0;transition:transform .2s;}
.chv.op{transform:rotate(180deg);}
.ac-body{border-top:1px solid #eee;}
.ac-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border-bottom:1px solid #eee;background:#FAFAFA;}
.ast{padding:8px 4px;text-align:center;border-right:1px solid #eee;}
.ast:last-child{border-right:none;}
.astl{font-size:10px;color:#888;font-weight:600;margin-bottom:2px;}
.astv{font-size:13px;font-weight:700;}
.addsec{padding:10px 12px;border-bottom:1px solid #eee;}
.addsec-grn{background:#F0FFF8;}
.addsec-org{background:#FFF8F0;}
.addsec-title{font-size:12px;font-weight:700;color:#555;margin-bottom:8px;}
.g3{display:grid;grid-template-columns:82px 1fr 68px;gap:6px;margin-bottom:6px;}
.g4{display:grid;grid-template-columns:80px 1fr 62px 54px;gap:6px;margin-bottom:6px;}
.g3 input,.g3 select,.g4 input,.g4 select{font-size:13px;min-height:38px;padding:6px 8px;}
.addrow{display:flex;gap:6px;}
.addrow select{flex:1;font-size:13px;min-height:38px;padding:6px 8px;}
.addbtn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;min-height:38px;white-space:nowrap;color:#fff;}
.pb-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.pb-table{width:100%;border-collapse:collapse;min-width:520px;font-size:12px;}
.pb-table th{background:#F0F0F5;padding:7px 8px;font-size:11px;font-weight:700;color:#666;text-align:left;border-bottom:1px solid #eee;white-space:nowrap;}
.pb-table td{padding:8px 8px;border-bottom:1px solid #eee;vertical-align:top;}
.pb-table tr:last-child td{border-bottom:none;}
.pb-table tr:nth-child(even) td{background:#FAFAFA;}
.td-cr{color:#1D9E75;font-weight:700;text-align:right;}
.td-dr{color:#D85A30;font-weight:700;text-align:right;}
.td-bal{font-weight:700;text-align:right;}
.td-ic{color:#BA7517;font-size:10px;margin-top:2px;}
.ac-footer{padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;background:#FAFAFA;flex-wrap:wrap;gap:6px;}
.pcard{background:#fff;border:1px solid #e5e5e5;border-radius:14px;margin-bottom:10px;overflow:hidden;}
.ph{display:flex;align-items:center;gap:11px;padding:13px;cursor:pointer;}
.ph:active{background:#f5f5f5;}
.pav{width:44px;height:44px;border-radius:50%;background:#eeedfe;color:#534AB7;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0;}
.pnm{font-weight:700;font-size:15px;}
.psb{font-size:12px;color:#888;margin-top:3px;display:flex;flex-wrap:wrap;gap:5px;}
.pbdy{border-top:1px solid #eee;}
.pst{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #eee;background:#FAFAFA;}
.ps{padding:9px 6px;text-align:center;border-right:1px solid #eee;}
.ps:last-child{border-right:none;}
.psl{font-size:10px;color:#888;font-weight:600;margin-bottom:2px;}.psv{font-size:14px;font-weight:700;}
.emi{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid #eee;}
.emi:last-child{border-bottom:none;}
.el{flex:1;}.en{font-size:13px;font-weight:700;}.ed{font-size:11px;color:#aaa;margin-top:2px;}
.ea{font-size:14px;font-weight:700;flex-shrink:0;margin-right:4px;}
.eac{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
.rc{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.rav{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;}
.ri{flex:1;min-width:0;}.rn{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rs{font-size:12px;color:#888;margin-top:2px;}.rr{text-align:right;flex-shrink:0;}
.ra{font-size:16px;font-weight:700;}
.xb{background:none;border:none;color:#ccc;font-size:20px;cursor:pointer;padding:4px;flex-shrink:0;}
.flt{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.flt select,.flt input{flex:1;min-height:42px;font-size:13px;min-width:100px;}
.ri-card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px 13px;margin-bottom:8px;}
.ri-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ri-name{font-weight:700;font-size:14px;}
.ri-amt{font-size:15px;font-weight:700;flex-shrink:0;}
.ri-meta{font-size:12px;color:#888;margin-top:4px;}
.ri-calc{font-size:11px;color:#BA7517;margin-top:4px;background:#FFF8F0;border-radius:6px;padding:5px 8px;}
.tot-box{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.tl{font-size:11px;color:#888;font-weight:600;margin-bottom:2px;}
.tv{font-size:16px;font-weight:700;}
.empty{text-align:center;color:#aaa;padding:28px;font-size:14px;}
@media print{
.nav,.top,.addsec,.btn.rd,.eac,.brow,.xb,.flt,.no-print{display:none!important;}
body{background:#fff;font-size:12px;}
.page{display:block!important;padding:0;}
.pb-table th,.pb-table td{padding:5px 6px!important;font-size:11px!important;}
}
</style>
</head>
<body>
<div class="top">
<div><h1>Ketan Verma</h1><p>Personal Finance - Not for firm</p></div>
<div class="topbtns">
<button class="tbtn" onclick="window.print()">Print</button>
<button class="tbtn" onclick="doCSV()">CSV</button>
</div></div>
<div class="page on" id="pg-ledger">
<div class="alrt" id="alrtBox"></div>
<div class="sum" id="sg1"></div>
<div class="fc no-print">
<div class="fh" style="background:#1D9E75;">+ Naya Party Account Banao</div>
<div class="fb">
<div class="r2"><div class="fg"><label>Party Ka Naam</label><input id="acname" placeholder="Naam"/></div>
<div class="fg"><label>Phone (optional)</label><input id="acphone" placeholder="Mobile" type="tel" inputmode="tel"/></div></div>
<div class="brow"><button class="btn gn" style="flex:1" onclick="addAccount()">+ Account Banao</button>
<button class="btn" onclick="clrAcForm()">Clear</button></div>
</div></div>
<div class="sec">Party Accounts</div>
<div id="acList"><div class="empty">Koi account nahi. Upar se banao.</div></div>
</div>
<div class="page" id="pg-party">
<div class="sum" id="sg2"></div>
<div class="fc no-print">
<div class="fh" style="background:#534AB7;">+ Party / Loan / EMI</div>
<div class="fb">
<div class="r2"><div class="fg"><label>Party Naam</label><input id="pn" placeholder="Naam"/></div>
<div class="fg"><label>Phone</label><input id="pph" placeholder="Optional" type="tel"/></div></div>
<div class="r2"><div class="fg"><label>Total Amount (Rs)</label><input type="number" id="pt" placeholder="Loan total" inputmode="decimal"/></div>
<div class="fg"><label>Start Date</label><input type="date" id="psd"/></div></div>
<div class="r2"><div class="fg"><label>EMI/Month (Rs)</label><input type="number" id="pe" placeholder="Har mahine" inputmode="decimal"/></div>
<div class="fg"><label>Total EMIs</label><input type="number" id="pm" placeholder="e.g. 12" inputmode="numeric"/></div></div>
<div class="r2"><div class="fg"><label>Interest Rate %</label><input type="number" id="prate" value="0" inputmode="decimal"/></div>
<div class="fg"><label>Type</label><select id="ptype"><option value="given">Maine Diya</option><option value="taken">Maine Liya</option></select></div></div>
<div class="r1 fg"><label>Note</label><input id="pnote" placeholder="Optional"/></div>
<div class="brow"><button class="btn pu" style="flex:1" onclick="addParty()">+ Add Party</button>
<button class="btn" onclick="clrP()">Clear</button></div>
</div></div>
<div class="sec">Party / EMI List</div>
<div id="pList"><div class="empty">Koi party nahi.</div></div>
</div>
<div class="page" id="pg-expense">
<div class="sum" id="sg3"></div>
<div class="fc no-print">
<div class="fh" style="background:#185FA5;">+ Kharcha Add Karo</div>
<div class="fb">
<div class="r2"><div class="fg"><label>Naam</label><input id="en" placeholder="e.g. Grocery"/></div>
<div class="fg"><label>Date</label><input type="date" id="ed"/></div></div>
<div class="r2"><div class="fg"><label>Category</label><select id="ec">
<option>Khana aur Grocery</option><option>Travel aur Petrol</option><option>Medical</option>
<option>Bijli Pani Bill</option><option>Entertainment</option><option>Kapde</option>
<option>Padhai</option><option>Ghar ka Kharcha</option><option>EMI aur Loan</option><option>Aur Kuch</option>
</select></div>
<div class="fg"><label>Amount (Rs)</label><input type="number" id="ea" placeholder="0" inputmode="decimal"/></div></div>
<div class="r1 fg"><label>Note</label><input id="enote" placeholder="Optional"/></div>
<div class="brow"><button class="btn bl" style="flex:1" onclick="addExp()">+ Kharcha Add Karo</button>
<button class="btn" onclick="clrE()">Clear</button></div>
</div></div>
<div class="sec">Kharche Ki List</div>
<div id="eList"><div class="empty">Koi kharcha nahi.</div></div>
</div>
<div class="page" id="pg-records">
<div class="flt no-print">
<select id="rf" onchange="renderRec()"><option value="all">Sab Records</option>
<option value="CR">Sirf Credit</option><option value="DR">Sirf Debit</option>
<option value="INT">Interest Only</option><option value="EMI">EMI</option><option value="EXP">Kharche</option></select>
<input type="month" id="rm" onchange="renderRec()"/>
</div>
<div class="flt no-print">
<button class="btn gn" style="flex:1;font-size:13px;" onclick="printRec()">Print Records</button>
<button class="btn bl" style="flex:1;font-size:13px;" onclick="dlRec()">Download CSV</button>
</div>
<div id="recList"><div class="empty">Koi records nahi.</div></div>
</div>
<div class="nav">
<button class="ni on" onclick="goTab('ledger',this)"><span class="ni-ic">&#128218;</span>Accounts</button>
<button class="ni" onclick="goTab('party',this)"><span class="ni-ic">&#128197;</span>Party EMI</button>
<button class="ni" onclick="goTab('expense',this)"><span class="ni-ic">&#128176;</span>Kharcha</button>
<button class="ni" onclick="goTab('records',this)"><span class="ni-ic">&#128196;</span>Records</button>
</div>
<script>
var AC=[],EP=[],EX=[];
var COLORS=["#185FA5","#1D9E75","#D85A30","#534AB7","#BA7517","#2E7D32","#C62828"];
function load(){
  try{AC=JSON.parse(localStorage.getItem("kv7_ac")||"[]");}catch(e){AC=[];}
  try{EP=JSON.parse(localStorage.getItem("kv7_ep")||"[]");}catch(e){EP=[];}
  try{EX=JSON.parse(localStorage.getItem("kv7_ex")||"[]");}catch(e){EX=[];}
}
function save(){
  try{
    localStorage.setItem("kv7_ac",JSON.stringify(AC));
    localStorage.setItem("kv7_ep",JSON.stringify(EP));
    localStorage.setItem("kv7_ex",JSON.stringify(EX));
  }catch(e){alert("Storage full. CSV export karo.");}
}
function f(n){return parseFloat(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});}
function td(){return new Date().toISOString().split("T")[0];}
function ini(s){var w2=s.trim().split(" ");return(w2.length>1?w2[0][0]+w2[w2.length-1][0]:s.slice(0,2)).toUpperCase();}
function dago(s){var a=new Date(s),b=new Date();b.setHours(0,0,0,0);a.setHours(0,0,0,0);return Math.max(0,Math.floor((b-a)/86400000));}
function el(id){return document.getElementById(id);}
function vl(id){return el(id).value;}
function calcI(amt,rate,days,method){
  if(!rate||days<=0)return 0;
  var r=rate/100;
  if(method==="compound")return amt*(Math.pow(1+r/365,days)-1);
  return amt*r*days/365;
}
function iDesc(amt,rate,days,method){
  if(!rate||days<=0)return "";
  var i=calcI(amt,rate,days,method);
  if(method==="compound")return "Rs "+f(amt)+" x [(1+"+rate+"%/365)^"+days+"din - 1] = Rs "+f(i);
  return "Rs "+f(amt)+" x "+rate+"% p.a. x "+days+" din / 365 = Rs "+f(i);
}
function addAccount(){
  var nm=vl("acname").trim(),ph=vl("acphone").trim();
  if(!nm){alert("Party ka naam likho!");return;}
  AC.unshift({id:Date.now(),name:nm,phone:ph,txns:[],open:true});
  save();renderAc();updateSum();clrAcForm();
}
function clrAcForm(){el("acname").value="";el("acphone").value="";}
function delAc(id){
  if(!confirm("Poora account delete hoga?"))return;
  AC=AC.filter(function(a){return a.id!==id;});
  save();renderAc();updateSum();
}
function togAc(id){
  var a=AC.find(function(x){return x.id===id;});
  if(a)a.open=!a.open;
  save();renderAc();
}
function addTxn(acid){
  var a=AC.find(function(x){return x.id===acid;});
  if(!a)return;
  var date=vl("td_"+acid);
  var type=vl("tt_"+acid);
  var amt=parseFloat(vl("ta_"+acid));
  var desc=vl("tdesc_"+acid).trim();
  var rate=parseFloat(vl("tr_"+acid))||0;
  var method=vl("tm_"+acid);
  if(!date||isNaN(amt)||amt<=0){alert("Date aur Amount zaroori hai!");return;}
  a.txns.push({id:Date.now(),date:date,type:type,amt:amt,desc:desc,rate:rate,method:method});
  a.txns.sort(function(x,y){return new Date(x.date)-new Date(y.date);});
  save();renderAc();updateSum();
  el("ta_"+acid).value="";
  el("tdesc_"+acid).value="";
  el("td_"+acid).value=td();
  el("tr_"+acid).value="12";
}
function addItxn(acid){
  var a=AC.find(function(x){return x.id===acid;});
  if(!a)return;
  var date=vl("itd_"+acid);
  var type=vl("itt_"+acid);
  var amt=parseFloat(vl("ita_"+acid));
  var desc=vl("itdesc_"+acid).trim();
  if(!date||isNaN(amt)||amt<=0){alert("Date aur Amount zaroori hai!");return;}
  if(!desc)desc=(type==="INT_RECV")?"Interest Mila":"Interest Diya";
  a.txns.push({id:Date.now(),date:date,type:type,amt:amt,desc:desc,rate:0,method:"simple"});
  a.txns.sort(function(x,y){return new Date(x.date)-new Date(y.date);});
  save();renderAc();updateSum();
  el("ita_"+acid).value="";
  el("itdesc_"+acid).value="";
  el("itd_"+acid).value=td();
}
function delTxn(acid,tid){
  if(!confirm("Transaction delete karo?"))return;
  var a=AC.find(function(x){return x.id===acid;});
  if(!a)return;
  a.txns=a.txns.filter(function(t){return t.id!==tid;});
  save();renderAc();updateSum();
}
function acStats(a){
  var tCR=0,tDR=0,tIR=0,tIP=0,bal=0;
  a.txns.forEach(function(t){
    var d=dago(t.date);
    var intr=(t.type==="CR"||t.type==="DR")?calcI(t.amt,t.rate,d,t.method):0;
    var tot=t.amt+intr;
    if(t.type==="CR"){tCR+=tot;bal+=tot;}
    else if(t.type==="DR"){tDR+=tot;bal-=tot;}
    else if(t.type==="INT_RECV"){tIR+=t.amt;bal+=t.amt;}
    else if(t.type==="INT_PAID"){tIP+=t.amt;bal-=t.amt;}
  });
  return {tCR:tCR,tDR:tDR,tIR:tIR,tIP:tIP,bal:bal};
}
function renderAc(){
  var c=el("acList");
  if(!AC.length){c.innerHTML='<div class="empty">Koi account nahi. Upar se banao.</div>';return;}
  var html="";
  AC.forEach(function(a,idx){
    var st=acStats(a);
    var bg=COLORS[idx%COLORS.length];
    var runBal=0;
    var pbRows="";
    if(a.txns.length){

function addParty(){
  var nm=vl("pn").trim(),ph=vl("pph").trim(),tot=parseFloat(vl("pt")),st=vl("psd");
  var ea=parseFloat(vl("pe")),mn=parseInt(vl("pm")),rt=parseFloat(vl("prate"))||0;
  var pt=vl("ptype"),no=vl("pnote").trim();
  if(!nm||!st||isNaN(tot)||tot<=0||isNaN(ea)||ea<=0||isNaN(mn)||mn<1){alert("Sab fields bharo!");return;}
  var emis=[];
  for(var i=0;i<mn;i++){var d=new Date(st);d.setMonth(d.getMonth()+i);emis.push({no:i+1,due:d.toISOString().split("T")[0],amt:ea,paid:false,pdate:null});}
  EP.unshift({id:Date.now(),name:nm,phone:ph,total:tot,start:st,emiAmt:ea,months:mn,rate:rt,ptype:pt,note:no,emis:emis,open:true});
  save();renderP();updateSum();clrP();
}

function markEmi(pid,no,paid){
  var p=EP.find(function(x){return x.id===pid;});if(!p)return;

}

function buildRows(filter,month){
  var rows=[];
  AC.forEach(function(a){
    a.txns.forEach(function(t){
      var tf=t.type;
      if(tf==="INT_RECV"||tf==="INT_PAID")tf="INT";
      if(filter!=="all"&&filter!==t.type&&filter!==tf)return;
      if(filter==="EMI"||filter==="EXP")return;
      if(month&&!t.date.startsWith(month))return;
      var d=dago(t.date);
      var intr=(t.type==="CR"||t.type==="DR")?calcI(t.amt,t.rate,d,t.method):0;
      var ic=intr>0?iDesc(t.amt,t.rate,d,t.method):"";
      var bc=t.type==="CR"?"b-cr":t.type==="DR"?"b-dr":t.type==="INT_RECV"?"b-ir":"b-ip";
      var ac=t.type==="CR"||t.type==="INT_RECV"?"gn":"rd";
      var tl=t.type==="INT_RECV"?"Int Mila":t.type==="INT_PAID"?"Int Diya":t.type;
      rows.push({date:t.date,type:tl,name:a.name,amt:t.amt+intr,ic:ic,note:t.desc||"",bc:bc,ac:ac,rate:t.rate});
    });
  });
  if(filter==="all"||filter==="EMI"){
    EP.forEach(function(p){
      p.emis.forEach(function(e){
        if(month&&!e.due.startsWith(month))return;
        var isO=!e.paid&&e.due<=td();
        var ic=p.rate>0?iDesc(p.total,p.rate,dago(p.start),"simple"):"";
        rows.push({date:e.due,type:"EMI",name:p.name,amt:e.amt,ic:ic,note:"EMI "+e.no+"/"+p.months+" - "+(e.paid?"Paid":isO?"Overdue":"Pending"),bc:"b-em",ac:e.paid?"gn":isO?"rd":"or",rate:p.rate});
      });
    });
  }
  if(filter==="all"||filter==="EXP"){
    EX.forEach(function(e){
      if(month&&!e.date.startsWith(month))return;
      rows.push({date:e.date,type:"EXP",name:e.name,amt:e.amt,ic:"",note:e.cat+(e.note?" - "+e.note:""),bc:"b-ex",ac:"rd",rate:0});
    });
  }
  rows.sort(function(a,b){return new Date(b.date)-new Date(a.date);});
  return rows;
}

    csv+="Balance: Rs "+f(Math.abs(st.bal))+" "+(st.bal>=0?"CR":"DR")+"\n";
  });
  csv+="\nPARTY EMI\nName,Total,EMI,Months,Rate%,Paid,Pending,Interest\n";
  EP.forEach(function(p){var pc=p.emis.filter(function(e){return e.paid;}).length;var it=p.rate>0?calcI(p.total,p.rate,dago(p.start),"simple"):0;csv+='"'+p.name+'",'+p.total+","+p.emiAmt+","+p.months+","+p.rate+","+pc+","+(p.months-pc)+","+it.toFixed(2)+"\n";});
  csv+="\nKHARCHA\nDate,Naam,Category,Amount\n";
  EX.forEach(function(e){csv+=e.date+',"'+(e.name||"")+'","'+(e.cat||"")+'",'+e.amt+"\n";});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="KetanVerma_"+td()+".csv";
  a.click();
}
load();
el("ed").value=td();
el("psd").value=td();
renderAc();renderE();renderP();updateSum();
</script>
